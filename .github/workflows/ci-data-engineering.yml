name: CI data-engineering

on:
  push:
    branches: [feature/data-pipeline]
    paths:
      - "data_engineering/**"
      - ".github/workflows/ci-data-engineering.yml"
  pull_request:
    paths:
      - "data_engineering/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data_engineering/requirements.txt

      - name: Install dependencies
        run: pip install -r data_engineering/requirements.txt

      - name: Run unit tests
        run: python -m pytest data_engineering/tests -v
